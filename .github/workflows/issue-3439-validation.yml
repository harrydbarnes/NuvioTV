name: Issue 3439 validation
on:
  push:
    branches: [test/3439-validation]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_USE_DEBUG_SIGNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Next Up unit tests including metadata snapshot
        run: ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.ui.screens.home.NextUpEpisode*Test' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-3439-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
