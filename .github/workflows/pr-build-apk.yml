name: PR Build APK

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APK_SUFFIX: harrybarnes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        env:
          CI_USE_DEBUG_SIGNING: "true"
        run: ./gradlew :app:assembleRelease -PciVersionNameSuffix=${APK_SUFFIX}

      - name: Rename APK files with suffix
        run: |
          # AGP output filenames do not reliably include versionNameSuffix.
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            dir="$(dirname "$apk")"
            name="$(basename "$apk" .apk)"
            if [[ "$name" != *"-${APK_SUFFIX}" ]]; then
              mv "$apk" "$dir/${name}-${APK_SUFFIX}.apk"
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuviotv-apk-${{ env.APK_SUFFIX }}
          path: app/build/outputs/apk/release/*${{ env.APK_SUFFIX }}.apk
          if-no-files-found: error
