name: PR Build APK

on:
  pull_request:

concurrency:
  group: pr-build-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi

      - name: Set Debug Signing
        run: echo "CI_USE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"

      - name: Build Release APKs
        run: ./gradlew app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pr-apks-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/release/*.apk
